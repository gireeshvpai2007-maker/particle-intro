<script>
const img = document.getElementById('src');
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const caption = document.getElementById('caption');
const statusEl = document.getElementById('status');

const SIZE = 380;
canvas.width = SIZE;
canvas.height = SIZE;

let particles = [];
const GAP = 3;
let scattered = false;

function buildParticles() {
  try {
    const off = document.createElement('canvas');
    off.width = SIZE; off.height = SIZE;
    const octx = off.getContext('2d');

    octx.save();
    octx.beginPath();
    octx.arc(SIZE/2, SIZE/2, SIZE/2, 0, Math.PI*2);
    octx.clip();
    const scale = Math.max(SIZE/img.naturalWidth, SIZE/img.naturalHeight);
    const w = img.naturalWidth*scale, h = img.naturalHeight*scale;
    octx.drawImage(img, (SIZE-w)/2, (SIZE-h)/2, w, h);
    octx.restore();

    const data = octx.getImageData(0,0,SIZE,SIZE).data;

    for (let y=0; y<SIZE; y+=GAP) {
      for (let x=0; x<SIZE; x+=GAP) {
        const i = (y*SIZE+x)*4;
        const a = data[i+3];
        if (a > 40) {
          const r=data[i], g=data[i+1], b=data[i+2];
          particles.push({
            tx: x, ty: y,
            x: Math.random()*SIZE, y: Math.random()*SIZE,
            vx:0, vy:0,
            color: `rgb(${r},${g},${b})`,
            size: GAP*0.9
          });
        }
      }
    }

    if (particles.length === 0) {
      statusEl.textContent = "No opaque pixels found — check image alpha channel.";
      return;
    }

    requestAnimationFrame(animate);
    setTimeout(()=> caption.classList.add('show'), 1800);
  } catch (err) {
    statusEl.textContent = "Error: " + err.message;
    console.error(err);
  }
}

// Robust load handling: image may already be loaded (data URI, cached)
// before this script runs, in which case 'load' event never fires.
if (img.complete && img.naturalWidth !== 0) {
  buildParticles();
} else {
  img.addEventListener('load', buildParticles);
  img.addEventListener('error', () => {
    statusEl.textContent = "Image failed to load.";
  });
}

function animate() {
  ctx.clearRect(0,0,SIZE,SIZE);
  for (const p of particles) {
    const dx = p.tx - p.x;
    const dy = p.ty - p.y;
    p.vx += dx * 0.02;
    p.vy += dy * 0.02;
    p.vx *= 0.85;
    p.vy *= 0.85;
    p.x += p.vx;
    p.y += p.vy;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  requestAnimationFrame(animate);
}

canvas.addEventListener('click', () => {
  scattered = !scattered;
  caption.classList.remove('show');
  for (const p of particles) {
    if (scattered) {
      p.x = SIZE/2 + (Math.random()-0.5)*700;
      p.y = SIZE/2 + (Math.random()-0.5)*700;
    }
  }
  if (!scattered) setTimeout(()=> caption.classList.add('show'), 1200);
});
</script>
